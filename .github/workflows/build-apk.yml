name: Genereaza APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul proiectului
        uses: actions/checkout@v4

      - name: Configurează Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurează Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pregătește proiectul Capacitor și Pictograma
        run: |
          # Șterge complet folderele vechi ca să nu rămână nimic blocat în cache-ul serverului
          rm -rf android www assets
          
          # Reconstruiește folderul public web curat cu fișierele tale actuale
          mkdir www
          cp -r * www/ 2>/dev/null || true
          rm -rf www/www www/.github
          
          # Inițializează dependințele npm necesare
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/assets
          
          # Generează structura nativă Android curată de la zero
          npx cap init "Studio Muzical AI" "com.pincky.studiomuzica" --web-dir=www
          npx cap add android
          
          # Generare simplificată și compatibilă pentru pictograma ta personalizată
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            npx capacitor-assets generate --android --iconBackgroundColor '#121212' --splashBackgroundColor '#121212'
          fi
          
          # Sincronizează activele în folderul nativ Android
          npx cap sync
          mkdir -p android/app/src/main/res/values
          sed -i 's/@mipmap\/ic_launcher_background/@color\/ic_launcher_background/g' android/app/src/main/res/mipmap-anydpi-v26/*.xml


      - name: Compilează fișierul APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvează fișierul APK
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Muzical-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
