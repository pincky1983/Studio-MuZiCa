name: Genereaza APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul proiectului
        uses: actions/checkout@v4

      - name: Configurează Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurează Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pregătește proiectul Capacitor
        run: |
          mkdir www
          cp *.html *.css *.js *.json *.svg www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap init "Studio Muzical AI" "com.pincky.studiomuzica" --web-dir=www
          echo '{"appId":"com.pincky.studiomuzica","appName":"Studio Muzical AI","webDir":"www","server":{"url":"https://github.io","cleartext":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync

      - name: Compilează fișierul APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvează fișierul APK
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Muzical-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
