<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Studio Muzical AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/abcjs-audio.css">
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script>
</head>
<body>  <!-- ECRAN DE PORNIRE ANIMAT (SPLASH SCREEN) -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-icon">🎵</div>
      <h1>Studio Muzical AI</h1>
      <p>Se pregătește studioul...</p>
      <div class="splash-loader"></div>
    </div>
  </div>


  <!-- ECRAN 1: MENIU PRINCIPAL -->
  <div id="home-screen" class="screen active">
    <header>
      <h1>Studio Muzical</h1>
      <p>Generator & Transpunere AI</p>
    </header>
        <!-- CONTROL VOLUM GLOBAL -->
    <div class="volume-control">
      <span id="vol-icon">🔊</span>
      <input type="range" id="master-volume" min="0" max="100" value="80" oninput="updateMasterVolume(this.value)">
      <span id="vol-value">80%</span>
    </div>

    <div class="grid-menu">
      <button class="menu-card jazz" onclick="openGenerator('jazz')">
        <span class="icon">🎷</span>
        <h2>Jazz</h2>
        <p>Modulații & Improvizație</p>
      </button>

      <button class="menu-card blues" onclick="openGenerator('blues')">
        <span class="icon">🎸</span>
        <h2>Blues</h2>
        <p>Progresii & Turnarounds</p>
      </button>

      <button class="menu-card gospel" onclick="openGenerator('gospel')">
        <span class="icon">🎹</span>
        <h2>Gospel</h2>
        <p>Modulații & Pasaje</p>
      </button>

      <button class="menu-card scanner" onclick="openScanner()">
        <span class="icon">📷</span>
        <h2>Scanare AI</h2>
        <p>Poză / PDF -> Transpunere</p>
      </button>
    </div>
  </div>

  <!-- ECRAN 2: GENERATOR JAZZ / BLUES / GOSPEL -->
  <div id="generator-screen" class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="goHome()">← Înapoi</button>
      <h2 id="genre-title">Jazz</h2>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>Măsura:</label>
        <select id="time-sig">
          <option value="4/4">4/4</option>
          <option value="3/4">3/4</option>
          <option value="2/4">2/4</option>
          <option value="6/8">6/8</option>
        </select>
      </div>

      <div class="control-group">
        <label>Lungime modulație:</label>
        <select id="bars-count">
          <option value="1">1 Măsură</option>
          <option value="2" selected>2 Măsuri</option>
          <option value="3">3 Măsuri</option>
          <option value="4">4 Măsuri</option>
        </select>
      </div>

      <div class="control-group">
        <label>Gama (Concert):</label>
        <select id="key-sig">
          <option value="C">Do Major (C)</option>
          <option value="F">Fa Major (F)</option>
          <option value="Bb">Si♭ Major (B♭)</option>
          <option value="Eb">Mi♭ Major (E♭)</option>
          <option value="G">Sol Major (G)</option>
          <option value="D">Re Major (D)</option>
          <option value="A">La Major (A)</option>
        </select>
      </div>

      <div class="control-group">
        <label>Instrument:</label>
        <select id="instrument">
          <option value="piano">Pian (Do / Concert)</option>
          <option value="trumpet_c">Trompetă Do (Concert)</option>
          <option value="guitar">Chitară (Do / Concert)</option>
          <option value="trumpet_bb">Trompetă Si♭ (+1 ton)</option>
          <option value="sax_tenor">Saxofon Tenor (Si♭)</option>
          <option value="sax_alto">Saxofon Alto (Mi♭)</option>
        </select>
      </div>

      <button class="generate-btn" onclick="generateMusic()">Generează Modulația</button>
    </div>

    <div id="audio-controls"></div>
    <div id="sheet-music-container">
      <div id="paper"></div>
    </div>
  </div>

  <!-- ECRAN 3: SCANARE AI SI TRANSPUNERE -->
  <div id="scanner-screen" class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="goHome()">← Înapoi</button>
      <h2>Scanare & Transpunere AI</h2>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>Cheie Gemini API:</label>
        <input type="password" id="api-key-input" placeholder="Lipește cheia API aici..." onchange="saveApiKey()">
      </div>

      <div class="control-group">
        <label>Transpune pentru:</label>
        <select id="scan-instrument" onchange="renderScannedMusic()">
          <option value="piano">Pian (Do / Concert)</option>
          <option value="trumpet_c">Trompetă Do (Concert)</option>
          <option value="guitar">Chitară (Do / Concert)</option>
          <option value="trumpet_bb">Trompetă Si♭ (+1 ton)</option>
          <option value="sax_tenor">Saxofon Tenor (Si♭)</option>
          <option value="sax_alto">Saxofon Alto (Mi♭)</option>
        </select>
      </div>

      <label class="file-btn">
        📷 Fă o poză / Încarcă Imagine
        <input type="file" accept="image/*" onchange="processFileWithAI(event)" hidden>
      </label>

      <label class="file-btn">
        📂 Încarcă Partitură PDF
        <input type="file" accept=".pdf,application/pdf,*/*" onchange="processFileWithAI(event)" hidden>
      </label>
    </div>

    <div id="ai-status" class="status-msg"></div>
          <div id="scan-audio-controls"></div>
        <div id="tempo-control-box" style="display:none; margin: 12px 0; background:#1e1e1e; padding:10px 14px; border-radius:10px; border:1px solid #333;">
          <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:14px;">
            <span>⏱️ Viteză redare (Tempo):</span>
            <strong id="tempo-val" style="color:#1db954;">100%</strong>
          </div>
          <input type="range" id="tempo-slider" min="50" max="150" value="100" oninput="changePlaybackTempo(this.value)" style="width:100%; accent-color:#1db954;">
        </div>

        <div id="scan-sheet-container" style="display:none;">
          <div id="scan-paper"></div>
          <div style="display:flex; gap:10px; margin-top:15px;">
            <button onclick="exportScoreToPDF()" style="flex:1; background:#1db954; color:#000; font-weight:bold; padding:12px; border:none; border-radius:10px; cursor:pointer;">📄 Exportă PDF</button>
            <button onclick="saveScoreToLibrary()" style="flex:1; background:#282828; color:#fff; font-weight:bold; padding:12px; border:1px solid #444; border-radius:10px; cursor:pointer;">💾 Salvează</button>
          </div>
        </div>

        <div id="saved-scores-section" style="margin-top:20px; text-align:left;">
          <h3 style="font-size:16px; color:#1db954; margin-bottom:10px;">📂 Partiturile Mele Salvate</h3>
          <div id="saved-scores-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>


    </div>

    <div id="preview-container">
      <img id="image-preview" style="display:none; max-width:100%; border-radius:8px; margin-top:15px;" />
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
